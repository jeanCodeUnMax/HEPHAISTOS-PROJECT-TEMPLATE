<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Cyberpunk 3D Breakout</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff00;
            font-family: monospace;
            font-size: 24px;
        }
        #powerup-info {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #ffff00;
            font-family: monospace;
            font-size: 18px;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: monospace;
        }
        .overlay.hidden { display: none; }
        .overlay button, .overlay a {
            margin-top: 20px;
            padding: 10px 20px;
            background: #00ff00;
            color: #000;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
        h1 { font-size: 48px; margin-bottom: 10px; }
        p { font-size: 24px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <div id="powerup-info">Power-ups: 0</div>
    <div id="startOverlay" class="overlay">
        <h1>Cyberpunk Breakout</h1>
        <p>Use LEFT/RIGHT arrows to move paddle</p>
        <p>Press SPACE to launch ball</p>
        <button id="startButton">Start Game</button>
    </div>
    <div id="gameOverOverlay" class="overlay">
        <h1>Game Over</h1>
        <p id="finalScore">Score: 0</p>
        <button id="restartButton">Restart</button>
    </div>
    <div id="winOverlay" class="overlay">
        <h1>You Win!</h1>
        <p id="winScore">Score: 0</p>
        <button id="winRestartButton">Play Again</button>
    </div>
    <script type="module" src="src/main.js?v=5"></script>
</body>
</html>
