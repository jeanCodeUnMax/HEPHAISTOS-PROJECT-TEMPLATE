id: T002
title: Implement paddle controls and ball physics
milestone: M01
objective: Implement player-controllable paddle and physics-based ball that bounces off walls and paddle correctly.
status: ACTIVE
depends_on:
  - T001
subtasks:
  - Create paddle mesh (thin box) and add to scene
  - Create ball mesh (sphere) and add to scene
  - Set up cannon-esx world and add paddle (kinematic) and ball (dynamic) bodies
  - Implement keyboard input handling (ArrowLeft/ArrowRight for paddle movement)
  - Synchronize Three.js mesh positions with physics body positions each frame
  - Set up collision detection between ball and paddle/walls
  - Implement ball launch on spacebar press
  - Add basic boundaries (walls, floor) to prevent objects from escaping
inputs:
  - src/main.js (from T001)
  - index.html
outputs:
  - src/main.js (updated with paddle, ball, physics)
  - src/physics.js (new module for physics world)
  - src/input.js (new module for input handling)
tests:
  - Manual: Paddle moves smoothly with arrow keys
  - Manual: Ball launches on spacebar and follows arc
  - Manual: Ball bounces off left/right walls and top wall
  - Manual: Ball bounces off paddle with appropriate angle
  - Manual: Ball falls when not hitting paddle (game over condition)
evidence:
  - evidence/T002/paddle_move.gif
  - evidence/T002/ball_bounce_wall.gif
  - evidence/T002/ball_bounce_paddle.gif
  - evidence/T002/console_log.txt
done_when:
  - Paddle responds to ArrowLeft/ArrowRight keys with smooth movement
  - Ball launches on spacebar press and follows predictable trajectory
  - Ball bounces off left/right walls and top wall with correct reflection
  - Ball bounces off paddle with angle dependent on point of impact
  - Ball falls below paddle when not intercepted (triggers game over state)
  - No JavaScript errors in console during gameplay
next: T003